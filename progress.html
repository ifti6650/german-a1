<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My progress · Deutsch A1</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5363cf"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="site.css"><script src="sync.js"></script>
<style>
main.pg{max-width:1080px;margin:0 auto;padding:8px 16px 56px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 34px/1.1 var(--display);margin-top:6px}
.tile .s{font-size:13px;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.panel h2{font:800 20px var(--display);margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line);padding-top:8px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.bars .b i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bars .b:hover i{background:var(--accent-2)}
.bars .b .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:2}
.bars .b:hover .tip{display:block}
.axis{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:4px}.axis span{flex:1;text-align:center;min-width:0;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.btn{display:inline-block;font:700 14px var(--body);padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--paper);text-decoration:none;border:0;cursor:pointer}
.empty{color:var(--muted);font-size:14px}
.gate{text-align:center;padding:40px 20px}
.wrong{color:#c2410c}
@media (prefers-color-scheme: dark){.wrong{color:#fb923c}}
</style></head><body>
<nav class="top"><div class="in"><a class="brand" href="index.html">Deutsch A1</a><div class="links"><a href="index.html">Home</a><a href="wortschatz.html">Wortschatz</a><a href="practice.html">Mistakes</a><a href="progress.html" class=on>Progress</a><a href="grammar-book.html">Grammar Book</a><a href="study-guide.html">Study Guide</a><a href="speaking.html">Sprechen</a></div></div></nav>
<header class="hero small"><div class="in"><div class="kicker">Track record</div><h1>My progress</h1><p>Every answer from the Wortschatz trainer, mistake practice and tests, saved to your account.</p></div></header>
<main class="pg" id="app"><div class="panel gate" id="gate"><p class="empty">Loading…</p></div></main>
<script>
(function () {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0') };

async function load(user) {
  const app = $('app');
  if (!user) { app.innerHTML = `<div class="panel gate"><h2>Sign in to see your progress</h2><p class="sub">Use the “Sign in with Google” button at the top.</p></div>`; return }
  const sb = A1.client;
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const [att, open, mastered, tests] = await Promise.all([
    sb.from('attempts').select('created_at,correct,lesson,kind,source').gte('created_at', since).order('created_at', { ascending: false }).limit(10000),
    sb.from('review_items').select('item_id,lesson,prompt,expected,last_answer,times_wrong,correct_streak').eq('mastered', false).order('times_wrong', { ascending: false }).limit(500),
    sb.from('review_items').select('item_id', { count: 'exact', head: true }).eq('mastered', true),
    sb.from('test_results').select('title,test_id,score,max_score,duration_sec,created_at').order('created_at', { ascending: false }).limit(15)
  ]);
  const err = [att, open, mastered, tests].find(r => r.error);
  if (err) { app.innerHTML = `<div class="panel"><p class="empty">Could not load data: ${esc(err.error.message)}</p></div>`; return }
  const A = att.data || [], O = open.data || [], T = tests.data || [];

  const today = dayKey(Date.now());
  const tA = A.filter(a => dayKey(a.created_at) === today);
  const w7 = A.filter(a => new Date(a.created_at) > Date.now() - 7 * 864e5);
  // streak: consecutive days with at least one answer, ending today or yesterday
  const days = new Set(A.map(a => dayKey(a.created_at)));
  let streak = 0; for (let i = days.has(today) ? 0 : 1; i < 31; i++) { if (days.has(dayKey(Date.now() - i * 864e5))) streak++; else break }

  // 14-day bars
  const bars = []; for (let i = 13; i >= 0; i--) { const k = dayKey(Date.now() - i * 864e5); const d = A.filter(a => dayKey(a.created_at) === k); bars.push({ k, n: d.length, ok: d.filter(a => a.correct).length }) }
  const maxN = Math.max(1, ...bars.map(b => b.n));
  const wd = k => new Date(k + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });

  // per lesson
  const byL = {}; A.forEach(a => { if (a.lesson == null) return; const l = byL[a.lesson] = byL[a.lesson] || { n: 0, ok: 0 }; l.n++; if (a.correct) l.ok++ });
  const openByL = {}; O.forEach(o => { if (o.lesson != null) openByL[o.lesson] = (openByL[o.lesson] || 0) + 1 });
  const lessons = [...new Set([...Object.keys(byL), ...Object.keys(openByL)].map(Number))].sort((a, b) => a - b);

  app.innerHTML = `
  <section class="tiles">
    <div class="tile"><div class="k">Today</div><div class="v">${tA.length}</div><div class="s">answers · ${pct(tA.filter(a => a.correct).length, tA.length)}% right</div></div>
    <div class="tile"><div class="k">Last 7 days</div><div class="v">${pct(w7.filter(a => a.correct).length, w7.length)}%</div><div class="s">right of ${w7.length} answers</div></div>
    <div class="tile"><div class="k">Streak</div><div class="v">${streak}</div><div class="s">day${streak === 1 ? '' : 's'} in a row</div></div>
    <div class="tile"><div class="k">Mistake list</div><div class="v">${O.length}</div><div class="s">open · ${mastered.count || 0} mastered</div></div>
  </section>
  <div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h2>Answers per day</h2><p class="sub" style="margin:0">Last 14 days · hover a bar for details</p></div>${O.length ? `<a class="btn" href="practice.html">Practise ${O.length} mistake${O.length === 1 ? '' : 's'} →</a>` : ''}</div>
    <div class="bars" role="img" aria-label="Answers per day for the last 14 days">${bars.map(b => `<div class="b"><span class="tip">${wd(b.k)}: ${b.n} answers, ${pct(b.ok, b.n)}% right</span><i style="height:${b.n / maxN * 100}%"></i></div>`).join('')}</div>
    <div class="axis">${bars.map((b, i) => `<span>${i % 2 ? '' : wd(b.k)}</span>`).join('')}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>By lesson</h2><p class="sub">Last 30 days</p>
      ${lessons.length ? `<table class="t"><thead><tr><th>Lektion</th><th class="n">Answers</th><th class="n">Right</th><th class="n">Open mistakes</th></tr></thead><tbody>
      ${lessons.map(l => { const x = byL[l] || { n: 0, ok: 0 }; return `<tr><td>L${l}</td><td class="n">${x.n}</td><td class="n">${pct(x.ok, x.n)}%<span class="meter"><i style="width:${pct(x.ok, x.n)}%"></i></span></td><td class="n">${openByL[l] ? `<a href="practice.html#L${l}">${openByL[l]}</a>` : '–'}</td></tr>` }).join('')}
      </tbody></table>` : `<p class="empty">No answers yet. Start with the <a href="wortschatz.html">Wortschatz trainer</a>.</p>`}
    </div>
    <div class="panel"><h2>Hardest items</h2><p class="sub">Most often wrong, still open</p>
      ${O.length ? `<table class="t"><thead><tr><th>Question</th><th>Correct</th><th>You wrote</th><th class="n">Wrong</th></tr></thead><tbody>
      ${O.slice(0, 12).map(o => `<tr><td>${esc(o.prompt || o.item_id)}</td><td><b>${esc(o.expected)}</b></td><td class="wrong">${esc(o.last_answer)}</td><td class="n">${o.times_wrong}×</td></tr>`).join('')}
      </tbody></table>` : `<p class="empty">Nothing on your mistake list. 🎉</p>`}
    </div>
  </div>
  <div class="panel"><h2>Test results</h2><p class="sub">Most recent first</p>
    ${T.length ? `<table class="t"><thead><tr><th>Test</th><th>Date</th><th class="n">Score</th><th class="n">Time</th></tr></thead><tbody>
    ${T.map(t => `<tr><td>${esc(t.title || t.test_id)}</td><td>${new Date(t.created_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}</td><td class="n">${+t.score}/${+t.max_score} · ${pct(t.score, t.max_score)}%</td><td class="n">${t.duration_sec ? Math.round(t.duration_sec / 60) + ' min' : '–'}</td></tr>`).join('')}
    </tbody></table>` : `<p class="empty">No tests yet. Lesson tests are coming next.</p>`}
  </div>`;
}
let last;
A1.onChange(u => { if (!A1.client) return; const id = u ? u.id : null; if (id === last) return; last = id; load(u) });
A1.ready.then(() => { if (!A1.client) $('app').innerHTML = `<div class="panel gate"><p class="empty">You're offline. Progress will show when you're back online.</p></div>`; else if (last === undefined) { last = A1.user ? A1.user.id : null; load(A1.user) } });
})();
</script>
<footer class="foot">Deutsch A1 · your progress is private to your account</footer>
<script src="install.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script></body></html>
