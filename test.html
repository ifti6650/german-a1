<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test · Deutsch A1</title><meta name="description" content="Lesson quizzes, module tests and level assessments for German A1."><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5363cf"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="app.css">
<script src="plan-data.js"></script><script src="lessons/l01.js"></script><script src="lessons/l02.js"></script><script src="lessons/l03.js"></script><script src="lessons/l04.js"></script><script src="lessons/l05.js"></script><script src="lessons/l06.js"></script><script src="course.js"></script><script src="engine.js"></script><script src="review.js"></script><script src="progress-model.js"></script><script src="sync.js"></script><script src="data.js"></script>
</head><body>
<a class="skip" href="#main" style="position:absolute;left:-999px">Skip to content</a>
<nav class="top"><div class="in"><a class="brand" href="index.html">Deutsch A1</a><div class="links"></div></div></nav>
<main class="pg narrow" id="main" style="padding-top:20px"><div id="app" class="skeleton">Loading…</div></main>
<dialog class="confirm" id="dlg"><h2 style="margin-top:0;font:800 20px var(--display)">Submit the test?</h2><p id="dlgTxt"></p><div class="run-actions"><button class="ex-btn ghost" id="dlgNo">Keep working</button><button class="ex-btn" id="dlgYes">Submit</button></div></dialog>
<script>
(function () {
  const esc = ENGINE.esc, $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id') || 'lesson-1';
  const T = COURSE.test(id);
  if (!T) { $('app').className = 'panel'; $('app').innerHTML = `<h2>Test not found</h2><p><a href="tests.html">All tests</a></p>`; return }
  document.title = T.title + ' · Deutsch A1';
  const KEY = 'a1:test:' + id;

  // Build the question set (deterministic from the seed, unique questions, at most one per vocabulary word)
  function build(seed) {
    const rand = ENGINE.rng(seed); const out = []; const seen = new Set();
    const add = q => { const k = q.vocabId || q.id; if (seen.has(k)) return false; seen.add(k); out.push(q); return true };
    const takeVocab = (n, k) => { let c = 0; for (const q of ENGINE.shuffle(A1D.vocabFor(n), rand)) { if (c >= k) break; if (add(q)) c++ } };
    const takeQuiz = (n, k) => ENGINE.shuffle(COURSE.content(n).quiz, rand).slice(0, k).forEach(add);
    if (T.kind === 'lesson') { const n = T.lessons[0]; if (COURSE.content(n)) COURSE.content(n).quiz.forEach(add); else takeVocab(n, 15) }
    else { const per = T.kind === 'module' ? 7 : 3; T.lessons.forEach(n => { if (COURSE.content(n)) { takeQuiz(n, per - 1); takeVocab(n, 1) } else takeVocab(n, per) }) }
    return out;
  }
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null') } catch (e) { return null } };
  const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)) } catch (e) {} };
  let S = load(), Q = [], cur = 0, ctrl = null, timer = null;

  function intro() {
    const resumable = S && !S.done && Date.now() < S.deadline;
    const qs = build(1);
    const vocabOnly = T.lessons.every(n => !COURSE.content(n));
    $('app').className = 'panel';
    $('app').innerHTML = `<div class="muted">${T.level} · ${T.kind === 'lesson' ? 'Lesson quiz' : T.kind === 'module' ? 'Module test' : 'Level assessment'}</div><h1 style="font:800 30px var(--display);margin:4px 0 8px">${esc(T.title)}</h1>
      <ul><li>${qs.length} questions · ${T.minutes} minutes</li><li>Answers and explanations are shown <b>after</b> you submit.</li><li>Pass mark: ${COURSE.PASS_PCT}%. You can retake it any time.</li>
      ${vocabOnly ? '<li>This test uses vocabulary questions only, because the full lesson content for these lessons is not written yet.</li>' : T.kind !== 'lesson' ? '<li>Lessons without full content contribute vocabulary questions only.</li>' : ''}
      <li>This is a practice assessment for self-study, not an official Goethe or telc exam result.</li></ul>
      ${A1.user ? '' : '<div class="notice">You are not signed in: your result is kept in this browser only.</div>'}
      <div class="run-actions" style="justify-content:flex-start">${resumable ? `<button class="ex-btn" id="resume">Resume (${Math.ceil((S.deadline - Date.now()) / 60000)} min left)</button><button class="ex-btn ghost" id="start">Start over</button>` : `<button class="ex-btn" id="start">Start test</button>`}<a class="ex-btn ghost" href="tests.html">All tests</a></div>`;
    $('start').onclick = () => { S = { seed: (Math.random() * 1e9) | 0, responses: {}, started: Date.now(), deadline: Date.now() + T.minutes * 60e3 }; save(S); begin() };
    if ($('resume')) $('resume').onclick = begin;
  }
  function begin() { Q = build(S.seed); cur = S.cur || 0; show(); clearInterval(timer); timer = setInterval(tick, 1000); tick() }
  function tick() {
    const left = S.deadline - Date.now(); const el = $('timer'); if (!el) return;
    if (left <= 0) { clearInterval(timer); submit(true); return }
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60; el.textContent = `${m}:${String(s).padStart(2, '0')}`; el.classList.toggle('low', left < 60e3);
  }
  const answered = q => { const r = S.responses[q.id]; if (r == null) return false; const c = ENGINE.check(q, r); return !c.empty };
  function show() {
    const q = Q[cur];
    $('app').className = 'panel';
    $('app').innerHTML = `<div class="row between"><b>${esc(T.title)}</b><span class="timer" id="timer" aria-label="Time left">–</span></div>
      <div class="run-top" style="margin:8px 0"><span>Question ${cur + 1} of ${Q.length}</span><span>${Q.filter(answered).length} answered</span></div>
      <div id="qbox"></div>
      <div class="run-actions" style="justify-content:space-between;margin-top:14px"><button class="ex-btn ghost" id="prev" ${cur ? '' : 'disabled'}>← Back</button>
        <span class="row"><button class="ex-btn ghost" id="sub">Submit test</button>${cur < Q.length - 1 ? '<button class="ex-btn" id="next">Next →</button>' : ''}</span></div>
      <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Jump to a question</summary><div class="tnav" style="margin-top:8px">${Q.map((x, i) => `<button data-j="${i}" class="${answered(x) ? 'ans' : ''} ${i === cur ? 'cur' : ''}" aria-label="Question ${i + 1}${answered(x) ? ', answered' : ''}">${i + 1}</button>`).join('')}</div></details>`;
    ctrl = ENGINE.mount($('qbox'), q, { mode: 'test', response: S.responses[q.id], onChange: r => { S.responses[q.id] = r; save(S) }, onEnter: () => cur < Q.length - 1 && move(1) });
    $('prev').onclick = () => move(-1); if ($('next')) $('next').onclick = () => move(1);
    $('sub').onclick = confirmSubmit;
    $('app').querySelectorAll('[data-j]').forEach(b => b.onclick = () => { cur = +b.dataset.j; S.cur = cur; save(S); show() });
    tick();
  }
  function move(d) { cur = Math.max(0, Math.min(Q.length - 1, cur + d)); S.cur = cur; save(S); show() }
  function confirmSubmit() {
    const open = Q.filter(q => !answered(q) && !['writing', 'speaking'].includes(q.type)).length;
    $('dlgTxt').textContent = open ? `${open} question${open === 1 ? ' is' : 's are'} still unanswered and will count as wrong.` : 'All questions are answered.';
    const d = $('dlg'); if (d.showModal) d.showModal(); else if (confirm($('dlgTxt').textContent + ' Submit?')) submit();
  }
  $('dlgNo').onclick = () => $('dlg').close(); $('dlgYes').onclick = () => { $('dlg').close(); submit() };

  function submit(timeUp) {
    clearInterval(timer);
    const items = Q.map(q => ({ q, response: S.responses[q.id], result: ENGINE.check(q, S.responses[q.id]) }));
    items.forEach(it => { if (it.result.empty) it.result = Object.assign({}, it.result, { correct: false, score: 0 }) });
    const sc = ENGINE.score(items); const secs = Math.round((Math.min(Date.now(), S.deadline) - S.started) / 1000);
    // persist: every graded answer (mistakes included), the result, the lesson quiz status
    items.forEach(it => A1D.record(it.q, it.result, it.response, 'test', id));
    const wrong = items.filter(it => it.result.graded && !it.result.correct).map(it => A1D.itemId(it.q));
    A1.saveTest({ id, title: T.title, kind: T.kind, score: sc.earned, max: sc.max, seconds: secs, wrong, breakdown: sc.by,
      answers: items.map(it => ({ id: A1D.itemId(it.q), r: ENGINE.responseText(it.q, it.response).slice(0, 200), ok: it.result.correct })) });
    try { const h = JSON.parse(localStorage.getItem('a1:testhist') || '[]'); h.unshift({ test_id: id, title: T.title, score: sc.earned, max_score: sc.max, created_at: new Date().toISOString(), local: true }); localStorage.setItem('a1:testhist', JSON.stringify(h.slice(0, 100))) } catch (e) {}
    if (T.kind === 'lesson') { const prev = PM.lesson(T.lessons[0]).quiz; A1.lessons.mark(T.lessons[0], 'test', { last: sc.pct, best: Math.max(sc.pct, prev ? prev.best : 0), passed: (prev && prev.passed) || sc.pct >= COURSE.PASS_PCT, tries: ((prev && prev.tries) || 0) + 1 }) }
    S.done = true; save(S); localStorage.removeItem(KEY);
    results(items, sc, secs, timeUp);
  }
  function results(items, sc, secs, timeUp) {
    const pass = sc.pct >= COURSE.PASS_PCT;
    const rows = (obj, lab) => Object.entries(obj).map(([k, v]) => `<tr><td>${esc(lab(k))}</td><td class="n">${Math.round(v.earned * 10) / 10}/${v.max}</td><td class="n">${Math.round(v.earned / v.max * 100)}%<span class="meter"><i style="width:${v.earned / v.max * 100}%"></i></span></td></tr>`).join('');
    const weak = Object.entries(sc.by.topic).filter(([, v]) => v.earned / v.max < 0.7).map(([k]) => k);
    $('app').className = '';
    $('app').innerHTML = `<div class="panel" style="text-align:center">${timeUp ? '<div class="notice warn">Time is up — your answers were submitted automatically.</div>' : ''}
      <div class="muted">${esc(T.title)}</div><div class="big-score">${sc.pct}%</div><p>${sc.earned} of ${sc.max} points · ${Math.floor(secs / 60)} min ${secs % 60} s · ${pass ? '<span class="pill ok">Passed</span>' : '<span class="pill warn">Not passed (pass mark ' + COURSE.PASS_PCT + '%)</span>'}</p>
      <div class="run-actions" style="justify-content:center"><a class="ex-btn" href="test.html?id=${id}">Retake</a>${items.some(i => i.result.graded && !i.result.correct) ? '<a class="ex-btn ghost" href="mistakes.html?status=due">Review my mistakes</a>' : ''}<a class="ex-btn ghost" href="${T.kind === 'lesson' ? 'lesson.html?l=' + T.lessons[0] : 'tests.html'}">${T.kind === 'lesson' ? 'Back to the lesson' : 'All tests'}</a></div></div>
      <div class="grid"><div class="panel"><h2>By skill</h2><table class="t"><tbody>${rows(sc.by.skill, k => k)}</tbody></table></div><div class="panel"><h2>By topic</h2><table class="t"><tbody>${rows(sc.by.topic, PM.label)}</tbody></table></div></div>
      ${weak.length ? `<div class="panel"><h2>What to do next</h2><ul>${weak.map(t => `<li>Practise <b>${esc(PM.label(t))}</b>: <a href="practice.html?topic=${encodeURIComponent(t)}">targeted practice</a></li>`).join('')}<li>Wrong answers are now in your <a href="mistakes.html">mistake list</a>.</li></ul></div>` : ''}
      <div class="panel"><h2>Your answers</h2>${items.map((it, i) => `<div class="learn-card"><div class="row between"><b>${i + 1}. ${esc(ENGINE.TYPE_LABEL[it.q.type])}</b>${it.result.graded ? (it.result.correct ? '<span class="pill ok">✓ correct</span>' : it.result.score > 0 ? `<span class="pill warn">${Math.round(it.result.score * 100)}%</span>` : '<span class="pill warn">✗ wrong</span>') : '<span class="pill dim">self-check</span>'}</div>
        <div lang="de">${esc(it.q.prompt || it.q.instructions)}</div>${it.q.audio ? `<div class="muted">Audio: <i lang="de">${esc(it.q.audio)}</i></div>` : ''}
        <div class="muted">Your answer: <span class="${it.result.correct ? '' : 'wrongtxt'}">${esc(ENGINE.responseText(it.q, it.response) || '—')}</span></div>
        ${it.result.correct ? '' : `<div>Correct: <b lang="de">${esc(ENGINE.answerText(it.q))}</b></div>`}${it.result.note ? `<div class="muted">${esc(it.result.note)}</div>` : ''}<div class="muted">${esc(it.q.explanation || '')}</div></div>`).join('')}</div>`;
    window.scrollTo(0, 0);
  }
  intro(); A1.onChange(() => { if (!Q.length) intro() });
})();
</script>
