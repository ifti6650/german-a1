<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice · Deutsch A1</title><meta name="description" content="Mixed German A1 practice by lesson, skill, topic and exercise type."><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f5fd6"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="app.css">
<script src="plan-data.js"></script><script src="lessons/l01.js"></script><script src="lessons/l02.js"></script><script src="lessons/l03.js"></script><script src="lessons/l04.js"></script><script src="lessons/l05.js"></script><script src="lessons/l06.js"></script><script src="lessons/l07.js"></script><script src="lessons/l08.js"></script><script src="lessons/l09.js"></script><script src="lessons/l10.js"></script><script src="lessons/l11.js"></script><script src="lessons/l12.js"></script><script src="lessons/l13.js"></script><script src="lessons/l14.js"></script><script src="lessons/l15.js"></script><script src="lessons/l16.js"></script><script src="lessons/l17.js"></script><script src="lessons/l18.js"></script><script src="lessons/l19.js"></script><script src="lessons/l20.js"></script><script src="lessons/l21.js"></script><script src="lessons/l22.js"></script><script src="lessons/l23.js"></script><script src="lessons/l24.js"></script><script src="course.js"></script><script src="engine.js"></script><script src="review.js"></script><script src="progress-model.js"></script><script src="sync.js"></script><script src="data.js"></script>
<link rel="stylesheet" href="ui.css"><script src="guard.js"></script>
</head><body>
<header class="hero small"><div class="in"><div class="kicker">Practice</div><h1>Practise anything, any time</h1><p>Mix exercises by lesson, skill, topic and type. Immediate feedback with explanations; wrong answers go to your <a href="mistakes.html">mistake list</a>.</p></div></header>
<main class="pg" id="main">
  <div class="panel"><h2>Build a practice set</h2>
    <div class="filters" style="margin-top:10px">
      <select id="pl" aria-label="Lesson"></select><select id="pk" aria-label="Skill"></select><select id="pt" aria-label="Exercise type"></select><select id="pc" aria-label="Topic"></select>
      <select id="pn" aria-label="Number of questions"><option>10</option><option selected>15</option><option>25</option></select>
      <button class="btn" id="go">Start</button></div>
    <p class="muted" id="avail"></p>
    <div class="row"><a class="btn ghost small" href="mistakes.html?status=due">🔁 Review due mistakes</a><a class="btn ghost small" href="wortschatz.html">🗂️ Wortschatz flashcards</a><a class="btn ghost small" href="speaking.html">🎤 Sprechen</a></div></div>
  <div class="panel" id="runner" hidden></div>
</main>
<script>
(function () {
  const esc = ENGINE.esc, $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search); const hl = (location.hash.match(/^#L(\d+)$/) || [])[1];
  const F = { lesson: P.get('lesson') || hl || 'all', skill: P.get('skill') || 'all', type: P.get('type') || 'all', topic: P.get('topic') || 'all' };
  function bank() {
    const out = [];
    COURSE.lessons.forEach(l => {
      if (F.lesson !== 'all' && String(l.n) !== F.lesson) return;
      const c = COURSE.content(l.n);
      if (c) [...c.practice, ...c.apply].forEach(q => out.push(q));
      A1D.vocabFor(l.n).forEach(q => out.push(q));
    });
    return out;
  }
  const match = q => (F.skill === 'all' || q.skill === F.skill) && (F.type === 'all' || q.type === F.type) && (F.topic === 'all' || q.topic === F.topic);
  const sel = (id, vals, cur, all, lab) => { $(id).innerHTML = `<option value="all">${all}</option>` + vals.map(v => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(lab ? lab(v) : v)}</option>`).join('') };
  function render() {
    sel('pl', COURSE.lessons.map(l => l.n), F.lesson, 'All lessons', v => `Lektion ${v}${COURSE.content(v) ? ' (full)' : ''}`);
    const b = bank();
    sel('pk', [...new Set(b.map(q => q.skill))].sort(), F.skill, 'All skills');
    sel('pt', [...new Set(b.map(q => q.type))].sort(), F.type, 'All types', v => ENGINE.TYPE_LABEL[v]);
    sel('pc', [...new Set(b.map(q => q.topic))].sort(), F.topic, 'All topics', PM.label);
    const n = b.filter(match).length; $('avail').textContent = `${n} question${n === 1 ? '' : 's'} available with these filters.`; $('go').disabled = !n;
  }
  ['pl', 'pk', 'pt', 'pc'].forEach((id, i) => $(id).onchange = e => { F[['lesson', 'skill', 'type', 'topic'][i]] = e.target.value; render() });
  $('go').onclick = () => {
    const qs = ENGINE.shuffle(bank().filter(match)).slice(0, +$('pn').value);
    const el = $('runner'); el.hidden = false;
    ENGINE.runPractice(el, qs, { title: 'Practice', onRecord: (q, res, resp) => A1D.record(q, res, resp, 'practice') });
    el.scrollIntoView({ behavior: 'smooth' });
  };
  render();
})();
</script>
<script src="shell.js"></script><script src="install.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script></body></html>
